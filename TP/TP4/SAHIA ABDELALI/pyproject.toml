# Fiche d'identité du package maintai : lue par pip install et par python -m build
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maintai"
dynamic = ["version"]  # lue dans maintai/__init__.py (voir plus bas)
description = "Prédiction de panne machine à partir de relevés de capteurs : modèle, API et commande en ligne."
readme = "README.md"
requires-python = ">=3.11"
# Ce dont le code de maintai/ a besoin pour fonctionner, une fois installé.
# Versions minimales (>=) et non figées (==) : c'est une bibliothèque, pas un déploiement.
dependencies = [
    "pandas>=2.2",         # maintai/data.py, dataset.py, predict.py
    "numpy>=1.26",         # maintai/dataset.py
    "scikit-learn>=1.5",   # maintai/data.py, train.py
    "joblib>=1.4",         # maintai/predict.py, train.py (chargement du modèle)
    "httpx>=0.27",         # maintai/client.py
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
ui = ["streamlit>=1.40"]
dev = ["pytest>=8", "ruff"]

# Point d'entrée : pip crée un exécutable maintai-predict qui appelle main() de maintai/cli.py
[project.scripts]
maintai-predict = "maintai.cli:main"

[tool.setuptools.dynamic]
version = {attr = "maintai.__version__"}

[tool.setuptools.packages.find]
include = ["maintai*"]  # seul le dossier maintai/ entre dans le package
