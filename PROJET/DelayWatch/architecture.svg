<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="760" viewBox="0 0 1560 760" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .box { fill: #ffffff; stroke: #9aa0a6; stroke-width: 2; rx: 12; }
    .hl  { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 3; }
    .band{ fill: #eceee8; stroke: #9aa0a6; stroke-width: 2; }
    .t   { font-size: 22px; font-weight: bold; fill: #202124; }
    .s   { font-size: 17px; fill: #5f6368; }
    .h1  { font-size: 28px; font-weight: bold; fill: #202124; }
    .h2  { font-size: 19px; fill: #5f6368; }
    .arr { stroke: #9aa0a6; stroke-width: 2.5; fill: none; marker-end: url(#m); }
  </style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <text x="60" y="56" class="h1">Le modèle est toujours servi par l'API sécurisée</text>
  <text x="60" y="90" class="h2">Flux de données du projet, du CSV DataCo au tableau de bord — sujet 7</text>

  <!-- Row 1 -->
  <rect class="box" x="60"  y="140" width="250" height="150" rx="12"/>
  <text x="185" y="190" text-anchor="middle" class="t">Dataset CSV</text>
  <text x="185" y="222" text-anchor="middle" class="s">≈ 180 500 commandes</text>
  <text x="185" y="248" text-anchor="middle" class="s">DataCo · Kaggle</text>

  <rect class="box" x="370" y="140" width="250" height="150" rx="12"/>
  <text x="495" y="182" text-anchor="middle" class="t">Préparation</text>
  <text x="495" y="212" text-anchor="middle" class="s">suppression données perso</text>
  <text x="495" y="238" text-anchor="middle" class="s">agrégation par commande</text>
  <text x="495" y="264" text-anchor="middle" class="s">filtre des fuites</text>

  <rect class="box" x="680" y="140" width="250" height="150" rx="12"/>
  <text x="805" y="185" text-anchor="middle" class="t">Entraînement</text>
  <text x="805" y="217" text-anchor="middle" class="s">classification + régression</text>
  <text x="805" y="243" text-anchor="middle" class="s">LogReg, XGBoost</text>
  <text x="805" y="269" text-anchor="middle" class="s">suivi MLflow</text>

  <rect class="box hl" x="990" y="140" width="250" height="150" rx="12"/>
  <text x="1115" y="185" text-anchor="middle" class="t">API FastAPI</text>
  <text x="1115" y="217" text-anchor="middle" class="s">/predict + clé API</text>
  <text x="1115" y="243" text-anchor="middle" class="s">schéma Pydantic anti-fuite</text>
  <text x="1115" y="269" text-anchor="middle" class="s">pytest</text>

  <rect class="box" x="1300" y="140" width="210" height="150" rx="12"/>
  <text x="1405" y="190" text-anchor="middle" class="t">Interface</text>
  <text x="1405" y="222" text-anchor="middle" class="s">Streamlit</text>
  <text x="1405" y="248" text-anchor="middle" class="s">risque, retard estimé</text>

  <!-- Row 1 arrows -->
  <line class="arr" x1="310" y1="215" x2="362" y2="215"/>
  <line class="arr" x1="620" y1="215" x2="672" y2="215"/>
  <line class="arr" x1="930" y1="215" x2="982" y2="215"/>
  <line class="arr" x1="1240" y1="215" x2="1292" y2="215"/>

  <!-- Row 2 -->
  <rect class="box" x="370" y="420" width="250" height="130" rx="12"/>
  <text x="495" y="470" text-anchor="middle" class="t">Git + DVC</text>
  <text x="495" y="502" text-anchor="middle" class="s">versions des données</text>
  <text x="495" y="528" text-anchor="middle" class="s">(nettoyées)</text>

  <rect class="box" x="990" y="420" width="250" height="130" rx="12"/>
  <text x="1115" y="470" text-anchor="middle" class="t">PostgreSQL</text>
  <text x="1115" y="502" text-anchor="middle" class="s">prédictions, audit</text>

  <rect class="box" x="1300" y="420" width="210" height="130" rx="12"/>
  <text x="1405" y="470" text-anchor="middle" class="t">Assistant RAG</text>
  <text x="1405" y="502" text-anchor="middle" class="s">optionnel, sources</text>

  <!-- Row 2 arrows -->
  <line class="arr" x1="495" y1="290" x2="495" y2="412"/>
  <line class="arr" x1="1115" y1="290" x2="1115" y2="412"/>
  <line class="arr" x1="1405" y1="412" x2="1405" y2="298"/>

  <!-- Docker band -->
  <rect class="band" x="60" y="620" width="1450" height="80" rx="12"/>
  <text x="785" y="668" text-anchor="middle" class="t">Docker Compose : API, interface et base dans des conteneurs</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
